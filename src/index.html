<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Los Secretos de Elisa</title>
<meta name="theme-color" content="#F6F3EE">
<script>
  // Tema (claro / oscuro / automático): se aplica antes de pintar para que no parpadee.
  (function () {
    var t = 'auto';
    try { t = JSON.parse(localStorage.getItem('theme')) || 'auto'; } catch (e) {}
    var dark = t === 'dark' || (t === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    document.querySelector('meta[name=theme-color]').setAttribute('content', dark ? '#14181A' : '#F6F3EE');
  })();
</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
<script>
  // El ingreso con Google solo funciona bien en el dominio de Firebase: si abrieron otro, los llevamos.
  (function () {
    var h = location.hostname, want = 'app-elisa-63e2e.firebaseapp.com';
    if (h === 'app-elisa-63e2e.web.app') location.replace('https://' + want + location.pathname + location.search);
  })();
</script>
