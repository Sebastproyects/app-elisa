name: Avisos programados

# Revisa cada 5 minutos si hay avisos pendientes y manda los resúmenes de horario fijo.
# GitHub puede retrasar unos minutos las ejecuciones programadas.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: avisos
  cancel-in-progress: false

jobs:
  avisos:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scheduler/package-lock.json
      - run: npm ci --prefix scheduler
      - run: node scheduler/avisos.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
